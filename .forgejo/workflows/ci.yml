name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ${{ vars.OPNSENSE_MCP_RUNNER }}
    container:
      image: docker.io/library/python:3.12-alpine
    steps:
      - name: Install git and node
        # actions/checkout is a Node-based action; these plain Python images
        # have neither by default.
        run: apk add --no-cache git nodejs
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Install ruff
        run: pip install --quiet ruff
      - name: Ruff check
        run: |
          ruff check .
          ruff format --check .

  pytest:
    runs-on: ${{ vars.OPNSENSE_MCP_RUNNER }}
    container:
      image: docker.io/library/python:3.12-bookworm
    steps:
      - name: Install git and node
        # actions/checkout is a Node-based action; these plain Python images
        # have neither by default.
        run: apt-get update && apt-get install -y --no-install-recommends git nodejs
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Install dependencies
        # The package itself, not just its requirements: build_info reads
        # importlib.metadata, so without an install it reports "unknown" and
        # test_get_build_info_uses_embedded_metadata fails. It passed until now
        # on whatever opnsense_mcp.egg-info happened to survive in the runner's
        # reused workspace, which is not something to depend on.
        run: |
          pip install --quiet -r requirements.txt -r requirements-dev.txt
          pip install --quiet -e . --no-deps
      - name: Run tests
        run: |
          pytest tests/ -q --tb=short \
            --cov=opnsense_mcp \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-fail-under=40
      # Coverage artifact upload is a known follow-up: upload-artifact@v4
      # fails against this Forgejo instance (investigated separately from
      # the core lint/test/build/deploy path).

  build_image:
    needs: [ruff, pytest]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.OPNSENSE_MCP_RUNNER }}
    container:
      image: quay.io/buildah/stable:v1.38
      options: --privileged
    env:
      # buildah defaults to the overlay driver, which needs fuse-overlayfs and
      # therefore /dev/fuse inside the job container. Passing --device /dev/fuse
      # only works if every runner in the pool sets container.privileged: true
      # and the host has the module loaded, and at least one does not: builds
      # failed with "fuse: device not found, try 'modprobe fuse' first".
      #
      # vfs needs no kernel support at all. It copies each layer instead of
      # stacking them, so builds are slower and use more scratch disk, which is
      # an acceptable price for not depending on how a given runner host is set
      # up. Revisit if the pool is ever made uniform.
      STORAGE_DRIVER: vfs
      BUILDAH_ISOLATION: chroot
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Install git and node
        # actions/checkout is a Node-based action; buildah/stable has
        # neither by default.
        run: dnf install -y git nodejs
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            export CI_COMMIT_TAG="${{ github.ref_name }}"
          fi
          export CI_COMMIT_SHORT_SHA="$(git rev-parse --short HEAD)"
          TAG="$(bash deploy/ci/compute-image-tag.sh)"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        env:
          # Optional. Set the repo variable OPNSENSE_MCP_REGISTRY (e.g.
          # registry.example) to push a built image; leave unset to build
          # locally only (no push).
          REGISTRY: ${{ vars.OPNSENSE_MCP_REGISTRY }}
          # Named for what they are, not for one registry. This file is
          # published, and the old names spelled out the host.
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${REGISTRY:-}" ]; then
            IMAGE="${REGISTRY}/opnsense-mcp:${{ steps.tag.outputs.image_tag }}"
          else
            IMAGE="opnsense-mcp:${{ steps.tag.outputs.image_tag }}"
          fi
          buildah build \
            -f deploy/Containerfile \
            --build-arg GIT_COMMIT="$(git rev-parse --short HEAD)" \
            --build-arg GIT_REF="${{ github.ref_name }}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${IMAGE}" .
          if [ -n "${REGISTRY:-}" ]; then
            if [ -n "${REGISTRY_USER:-}" ] && [ -n "${REGISTRY_PASSWORD:-}" ]; then
              buildah login -u "${REGISTRY_USER}" -p "${REGISTRY_PASSWORD}" "${REGISTRY}"
            else
              # The normal path here: the registry accepts pushes from the
              # local network, so credentials are only needed if that changes.
              echo "Pushing without credentials (none configured)." >&2
            fi
            buildah push "${IMAGE}"
          else
            echo "OPNSENSE_MCP_REGISTRY not set; built ${IMAGE} locally, not pushed."
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
