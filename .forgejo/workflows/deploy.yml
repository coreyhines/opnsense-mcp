name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. 1.0.0-dev.abcd1234)"
        required: true

jobs:
  deploy:
    runs-on: ${{ vars.OPNSENSE_MCP_RUNNER }}
    container:
      image: docker.io/library/alpine:3.22.0
    environment:
      name: ${{ vars.OPNSENSE_MCP_DEPLOY_ENV }}
      url: ${{ vars.OPNSENSE_MCP_SERVICE_URL }}
    steps:
      - name: Install git and ssh client
        run: apk add --no-cache git openssh-client bash
      - name: Checkout
        # Inline git: actions/checkout@v6 is copied into /var/run/act inside the
        # job container; /var/run -> /run makes Podman CopyToContainer fail with
        # "path escapes from parent" (moby#53258 / act#6092). See
        # deploy/ci/forgejo-git-checkout.md.
        env:
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          server="${GITHUB_SERVER_URL:?}"
          repo="${GITHUB_REPOSITORY:?}"
          sha="${GITHUB_SHA:?}"
          token="${REPO_TOKEN:-${GITHUB_TOKEN:-}}"
          base="${server%/}/${repo}.git"
          if [ -n "${token}" ]; then
            origin="https://x-access-token:${token}@${base#https://}"
          else
            origin="${base}"
          fi
          git init
          git remote add origin "${origin}"
          git fetch --depth 1 origin "${sha}"
          git checkout --force FETCH_HEAD
          git remote set-url origin "${base}"
      - name: Deploy
        env:
          OPNSENSE_MCP_DEPLOY_SSH_KEY_B64: ${{ secrets.OPNSENSE_MCP_DEPLOY_SSH_KEY_B64 }}
          OPNSENSE_MCP_DEPLOY_HOST: ${{ secrets.OPNSENSE_MCP_DEPLOY_HOST }}
          OPNSENSE_MCP_IMAGE_TAG: ${{ inputs.image_tag }}
          # Optional. Same repo variable as ci.yml's build job; leave unset
          # to deploy the bare local image name.
          REGISTRY: ${{ vars.OPNSENSE_MCP_REGISTRY }}
        run: |
          set -euo pipefail
          if [ -n "${REGISTRY:-}" ]; then
            OPNSENSE_MCP_IMAGE_REPO="${REGISTRY}/opnsense-mcp"
          else
            OPNSENSE_MCP_IMAGE_REPO="opnsense-mcp"
          fi
          bash deploy/ci/ssh-setup.sh
          scp -o StrictHostKeyChecking=no deploy/ci/deploy-host.sh \
            "${OPNSENSE_MCP_DEPLOY_USER:-root}@${OPNSENSE_MCP_DEPLOY_HOST}:/tmp/opnsense-mcp-deploy.sh"
          ssh -o StrictHostKeyChecking=no "${OPNSENSE_MCP_DEPLOY_USER:-root}@${OPNSENSE_MCP_DEPLOY_HOST}" \
            "sudo env OPNSENSE_MCP_IMAGE_REPO=${OPNSENSE_MCP_IMAGE_REPO} OPNSENSE_MCP_IMAGE_TAG=${OPNSENSE_MCP_IMAGE_TAG} bash /tmp/opnsense-mcp-deploy.sh"
