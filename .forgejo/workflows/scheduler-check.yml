name: Scheduler check

# Temporary. This repository has never had a scheduled run: every one of its
# runs so far was triggered by a push or a dispatch, and the only workflow with
# a cron has not reached its first Monday. So it is unknown whether Forgejo's
# scheduler is wired up here at all.
#
# That matters before turning on the publisher's daily run, which would
# otherwise sit there looking configured and never fire. A five-minute cron
# answers it in one coffee rather than one week.
#
# Delete this file once a run appears with event "schedule".

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ${{ vars.OPNSENSE_MCP_RUNNER }}
    container:
      image: docker.io/library/alpine:3.22.0
    steps:
      - name: Report what triggered this
        run: |
          echo "event:    ${{ github.event_name }}"
          echo "time:     $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "ref:      ${{ github.ref }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "The scheduler works. Delete .forgejo/workflows/scheduler-check.yml."
          else
            echo "Triggered manually; this proves nothing about the scheduler."
          fi
