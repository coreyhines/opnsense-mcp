name: Insights

# Advisory only — nothing here blocks a merge. It prints where defects are
# likely to be, so an expensive review reads the risky code first and can stop
# early. The gates (fail-the-build thresholds) come later, once the numbers are
# trusted; today these are a map, not a fence.
#
# Three signals, cheapest first:
#   - risk map: git churn x fix density, the strongest and free
#   - complexity: radon, hotspots worth reading before the rest
#   - security patterns: bandit, which already caught a /tmp issue this project
#     shipped because it was a dev tool and not in CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  risk:
    runs-on: ${{ vars.OPNSENSE_MCP_RUNNER }}
    container:
      image: docker.io/library/python:3.12-bookworm
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git
      - name: Checkout
        # Inline git: actions/checkout@v6 is copied into /var/run/act inside the
        # job container; /var/run -> /run makes Podman CopyToContainer fail with
        # "path escapes from parent" (moby#53258 / act#6092). See
        # deploy/ci/forgejo-git-checkout.md.
        env:
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          server="${GITHUB_SERVER_URL:?}"
          repo="${GITHUB_REPOSITORY:?}"
          sha="${GITHUB_SHA:?}"
          token="${REPO_TOKEN:-${GITHUB_TOKEN:-}}"
          base="${server%/}/${repo}.git"
          if [ -n "${token}" ]; then
            origin="https://x-access-token:${token}@${base#https://}"
          else
            origin="${base}"
          fi
          git init
          git remote add origin "${origin}"
          # Full history (was checkout fetch-depth: 0). Needed for
          # history scanners / risk map / mirror publish selection.
          git fetch --prune --no-tags origin "+refs/heads/*:refs/remotes/origin/*" "${sha}"
          git checkout --force "${sha}"
          git remote set-url origin "${base}"

      - name: Defect-risk map
        run: |
          echo "::group::Where defects concentrate (churn x fix density)"
          python3 scripts/risk_map.py --top 15
          echo "::endgroup::"

      - name: Complexity hotspots
        run: |
          pip install --quiet radon
          echo "::group::Functions ranked C or worse (complexity)"
          # Non-blocking: report only. -nc shows C and below.
          radon cc opnsense_mcp -nc -s || true
          echo "::endgroup::"

      - name: Security patterns (advisory)
        run: |
          pip install --quiet bandit
          echo "::group::Bandit findings"
          # -ll: only medium+ severity, to keep the signal readable. Never fails
          # the job — this is the advisory pass, and security.yml is the gate.
          bandit -r opnsense_mcp scripts -ll || true
          echo "::endgroup::"
