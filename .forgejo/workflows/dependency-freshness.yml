name: Dependency freshness

# The suite proves the pins agree with each other. Nothing proves they agree
# with upstream, because that changes without anyone touching this repo. So it
# runs on a clock instead, and files an issue rather than failing a build
# nobody asked to run.

on:
  schedule:
    # Weekly, Monday 07:00 UTC, an hour after the flent baseline.
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  survey:
    runs-on: ${{ vars.OPNSENSE_MCP_RUNNER }}
    container:
      image: docker.io/library/python:3.12-slim
    steps:
      - name: Install git and curl
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl >/dev/null
      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt -r requirements-dev.txt

      - name: Survey
        id: survey
        run: |
          set +e
          python scripts/check_dependency_freshness.py | tee /tmp/survey.txt
          echo "stale=$?" >> "$GITHUB_OUTPUT"
          python scripts/check_dependency_freshness.py --json > /tmp/survey.json 2>/dev/null
          set -e

      - name: File an issue when something is behind
        if: steps.survey.outputs.stale != '0'
        env:
          FORGEJO_TOKEN: ${{ secrets.OPNSENSE_MCP_ISSUE_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          if [ -z "${FORGEJO_TOKEN}" ]; then
            echo "OPNSENSE_MCP_ISSUE_TOKEN is not set; printing instead." >&2
            cat /tmp/survey.txt
            exit 1
          fi
          # One open issue at a time: reopening a fresh one every week is noise.
          existing=$(curl -sS -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${SERVER}/api/v1/repos/${REPO}/issues?state=open&labels=dependencies" \
            | python -c "import json,sys; print(len(json.load(sys.stdin)))")
          if [ "${existing}" != "0" ]; then
            echo "A dependencies issue is already open; not filing another."
            exit 0
          fi
          body=$(python - <<'PY'
          import json
          rows = json.load(open("/tmp/survey.json"))
          stale = [r for r in rows if r["state"] in ("behind", "prerelease")]
          lines = ["| package | installed | latest stable | state |", "|---|---|---|---|"]
          lines += [
              f"| `{r['name']}` | {r['installed']} | {r['latest_stable']} | {r['state']} |"
              for r in stale
          ]
          print(
              "The weekly survey found dependencies behind their latest stable "
              "release.\n\n" + "\n".join(lines) + "\n\n"
              "Raise the floors in `pyproject.toml`, regenerate the requirements "
              "files from it, and run the suite. A `prerelease` row that is not "
              "marked `(declared)` means something pulled a prerelease nobody "
              "asked for.\n\n"
              "Filed by `.forgejo/workflows/dependency-freshness.yml`."
          )
          PY
          )
          curl -sS -X POST -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            "${SERVER}/api/v1/repos/${REPO}/issues" \
            -d "$(python -c "
          import json,sys
          print(json.dumps({
              'title': 'Dependencies are behind their latest stable releases',
              'body': sys.stdin.read(),
              'labels': [],
          }))" <<< "${body}")" >/dev/null
          echo "Issue filed."
